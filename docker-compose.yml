services:
  # Primary FastAPI inference & skill-gap diagnostic microservice
  skill-assistant-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-technical-skill-assistant:2.1.0
    container_name: skill_assistant_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional MLflow tracking and experiment visualization UI
  mlflow-server:
    image: python:3.11-slim
    container_name: skill_assistant_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir mlflow==2.17.2 &&
             mlflow server --backend-store-uri mlruns --host 0.0.0.0 --port 5000"

