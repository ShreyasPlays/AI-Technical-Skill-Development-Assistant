      url: "https://www.refactoringui.com/"
      type: "UI Design Guide"
    - name: "Google UX Design Professional Certificate"
      url: "https://www.coursera.org/professional-certificates/google-ux-design"
      type: "Professional Certificate"
    - name: "Figma Community Tutorials & Component Libraries"
      url: "https://www.figma.com/community"
      type: "Interactive Templates"
  practice:
    - "Design a high-fidelity interactive dashboard mockup in Figma"
    - "Audit a web application for WCAG accessibility compliance using Lighthouse"
  project: "Create a design system component library in Figma and code responsive UI components in HTML/CSS."
