# -----------------------------------------------------------------------
# Model hyperparameters — intentionally constrained to target 70-80%
# test accuracy for the binary assessment pass/fail classifier.
# -----------------------------------------------------------------------
models:
  random_state: 42

  decision_tree:
    max_depth: 5          # constrained depth prevents overfitting
    min_samples_split: 10
    min_samples_leaf: 5
    criterion: "gini"

  random_forest:
    n_estimators: 100
    max_depth: 7          # ensemble regularised — champion model
    max_features: "sqrt"
    min_samples_split: 8
    min_samples_leaf: 4
    criterion: "gini"
    n_jobs: -1

  logistic_regression:
    C: 1.0                # moderate L2 regularisation
    max_iter: 1000
    solver: "lbfgs"

mlflow:
  experiment_name: "Assessment_Pass_Predictor"
  tracking_uri: "mlruns"
