    software_engineering: 5
    database_fundamentals: 3
    troubleshooting_skills: 3
  Cyber Security Specialist:
    cyber_security: 6
    networking: 5
    computer_forensics_fundamentals: 4
    troubleshooting_skills: 4
    programming_skills: 3
  Networking Engineer:
    networking: 6
    cyber_security: 4
    troubleshooting_skills: 4
    distributed_computing_systems: 4
