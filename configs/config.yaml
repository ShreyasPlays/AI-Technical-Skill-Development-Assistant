project_name: "AI-Technical-Skill-Development-Assistant"
version: "2.0.0"

paths:
  raw_data_path: "data/raw/skills_dataset.csv"
  processed_train_path: "data/processed/train.parquet"
  processed_test_path: "data/processed/test.parquet"
  features_meta_path: "data/processed/feature_metadata.json"
  models_dir: "models"
  reports_dir: "reports"
  metrics_path: "reports/metrics.json"
  evaluation_report_path: "reports/phase1_rework_evaluation.md"

data:
  test_size: 0.2
  random_state: 42
  stratify: true
  target_column: "assessment_pass"
  assessment_threshold: 0.50
  skill_features:
    - "database_fundamentals"
    - "computer_architecture"
    - "distributed_computing_systems"
    - "cyber_security"
    - "networking"
    - "software_development"
    - "programming_skills"
    - "project_management"
    - "computer_forensics_fundamentals"
    - "technical_communication"
    - "ai_ml"
    - "software_engineering"
    - "business_analysis"
    - "communication_skills"
    - "data_science"
    - "troubleshooting_skills"
    - "graphics_designing"
  context_features:
    - "openness"
    - "conscientiousness"
    - "extraversion"
    - "agreeableness"
    - "emotional_range"
    - "conversation"
    - "openness_to_change"
    - "hedonism"
    - "self_enhancement"
    - "self_transcendence"

